appId: app.viewflux.desktop
productName: ViewFlux
copyright: Copyright © 2026 ViewFlux Desktop Contributors

publish:
  provider: github
  owner: hihumanzone
  repo: ViewFlux

directories:
  buildResources: build
  output: release

# Everything the app needs at runtime is emitted by electron-vite into `out/`,
# plus the externalized production dependency (youtubei.js) which electron-builder
# resolves from node_modules automatically.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.eslintrc.*,.prettierrc,.prettierrc.*,.editorconfig,tsconfig*.json}'
  - '!**/{README.md,CHANGELOG.md,LICENSE.md}'

asar: true

win:
  executableName: ViewFlux
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: ViewFlux
  uninstallDisplayName: ViewFlux
  artifactName: ViewFlux-Setup-${version}.${ext}
  deleteAppDataOnUninstall: true
  differentialPackage: true
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  executableName: ViewFlux
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ViewFlux-mac-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  backgroundColor: '#0f0d13'
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  executableName: viewflux
  category: AudioVideo
  icon: build/icon.png
  maintainer: "ViewFlux Desktop Contributors <contributors@viewflux.app>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ViewFlux-Linux-${version}-${arch}.${ext}

# No native modules are used, so skip the electron-rebuild pass entirely.
npmRebuild: false
publish: never

